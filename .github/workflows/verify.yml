name: Verify Agent

on:
  workflow_dispatch:
    inputs:
      ui_runtime_ref:
        description: Exact approved UI runtime commit SHA (defaults to SFDC_UI_RUNTIME_REF)
        required: false
        type: string
  pull_request:
    branches: [dev, dev2]
  push:
    branches: [dev2]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: SFDC_Agent
    steps:
      - uses: actions/checkout@v6
        with:
          path: SFDC_Agent
          persist-credentials: false
      - name: Require the approved private runtime dependency
        env:
          RUNTIME_REF: ${{ inputs.ui_runtime_ref || vars.SFDC_UI_RUNTIME_REF }}
          RUNTIME_TOKEN: ${{ secrets.SFDC_RUNTIME_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,re
          if not re.fullmatch(r'[a-f0-9]{40}', os.environ.get('RUNTIME_REF', '')):
              raise SystemExit('Set SFDC_UI_RUNTIME_REF to the approved immutable UI commit SHA; branch fallback is forbidden.')
          if not os.environ.get('RUNTIME_TOKEN'):
              raise SystemExit('Configure SFDC_RUNTIME_READ_TOKEN with read-only access to the private sfdc_ui runtime repository.')
          PY
      - uses: actions/checkout@v6
        with:
          repository: choijoonbin/sfdc_ui
          ref: ${{ inputs.ui_runtime_ref || vars.SFDC_UI_RUNTIME_REF }}
          token: ${{ secrets.SFDC_RUNTIME_READ_TOKEN }}
          path: SFDC_Ui
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: SFDC_Ui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: SFDC_Ui
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: SFDC_Agent/requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Verify complete Agent and matched Node contracts without skipped tests
        env:
          PYTHONPATH: src
          RUNTIME_REF: ${{ inputs.ui_runtime_ref || vars.SFDC_UI_RUNTIME_REF }}
        run: python scripts/verify-unit-contracts.py --ui-root ../SFDC_Ui --expected-ui-ref "$RUNTIME_REF" --report unit-contract-proof.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: agent-unit-contract-proof
          path: SFDC_Agent/unit-contract-proof.json
          if-no-files-found: warn
