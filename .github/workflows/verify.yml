name: Verify Agent

on:
  workflow_dispatch:
    inputs:
      ui_runtime_ref:
        description: Exact approved UI runtime commit SHA (design defaults to reviewed runtime lock)
        required: false
        type: string
  pull_request:
    branches: [dev, dev_fe, design]
  push:
    branches: [dev, design]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}-${{ inputs.ui_runtime_ref || vars.SFDC_UI_RUNTIME_REF }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: SFDC_Agent
    steps:
      - uses: actions/checkout@v6
        with:
          path: SFDC_Agent
          persist-credentials: false
      - name: Require the approved private runtime dependency
        id: runtime
        env:
          RUNTIME_REF: ${{ inputs.ui_runtime_ref || vars.SFDC_UI_RUNTIME_REF }}
          REQUESTED_RUNTIME_REF: ${{ inputs.ui_runtime_ref }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          RUNTIME_SSH_KEY: ${{ secrets.SFDC_RUNTIME_READ_SSH_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,re
          ref=os.environ.get('RUNTIME_REF','')
          if os.environ.get('BRANCH_NAME')=='design' and not os.environ.get('REQUESTED_RUNTIME_REF'):
              pin=json.load(open('deployment/design-runtime-lock.json'))
              if pin.get('schemaVersion')!=1 or pin.get('sourceRepository')!='https://github.com/choijoonbin/sfdc_ui.git' or pin.get('engineContract')!='nextbss-lwc-v1':
                  raise SystemExit('The design runtime dependency lock is invalid.')
              ref=pin.get('commit','')
          if not re.fullmatch(r'[a-f0-9]{40}', ref):
              raise SystemExit('Set SFDC_UI_RUNTIME_REF to the approved immutable UI commit SHA; branch fallback is forbidden.')
          if not os.environ.get('RUNTIME_SSH_KEY'):
              raise SystemExit('Configure SFDC_RUNTIME_READ_SSH_KEY with a read-only SSH deploy key for the private sfdc_ui runtime repository.')
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream: stream.write('ref='+ref+'\n')
          PY
      - uses: actions/checkout@v6
        with:
          repository: choijoonbin/sfdc_ui
          ref: ${{ steps.runtime.outputs.ref }}
          ssh-key: ${{ secrets.SFDC_RUNTIME_READ_SSH_KEY }}
          path: SFDC_Ui
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: SFDC_Ui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: SFDC_Ui
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: SFDC_Agent/requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Verify complete Agent and matched Node contracts without skipped tests
        env:
          PYTHONPATH: src
          RUNTIME_REF: ${{ steps.runtime.outputs.ref }}
        run: python scripts/verify-unit-contracts.py --ui-root ../SFDC_Ui --expected-ui-ref "$RUNTIME_REF" --report unit-contract-proof.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: agent-unit-contract-proof
          path: SFDC_Agent/unit-contract-proof.json
          if-no-files-found: warn
