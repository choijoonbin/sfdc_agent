name: Verify workflow contracts

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths: ['.github/workflows/**']
  push:
    branches: [dev]
    paths: ['.github/workflows/**']

permissions:
  contents: read

concurrency:
  group: workflow-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify pinned workflow validator
        shell: bash
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 60 --max-filesize 4000000 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= -color
