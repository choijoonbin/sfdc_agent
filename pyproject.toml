[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sfdc-agent"
version = "0.1.0"
description = "Figma-to-LWC model orchestration for SFDC_Ui"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]

[project.scripts]
sfdc-agent = "sfdc_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sfdc_agent = ["*.mjs"]
